name: Java CI & Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # On pull requests, check out the PR head commit.
          # fetch-depth: 0 is required for Qodana's analysis.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean verify

      - name: Upload code coverage report
        uses: codecov/codecov-action@v4

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.2
        with:
          args: --fail-threshold=0 --save-report --report-dir=qodana-report

      - name: Upload Qodana report as an artifact
        uses: actions/upload-artifact@v4
        if: always() # This ensures the report is uploaded even if a previous step fails
        with:
          name: qodana-report
          path: qodana-report/