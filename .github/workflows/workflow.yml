name: Java CI & Code Quality on Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # On pull requests, check out the PR head commit.
          # fetch-depth: 0 is required for Qodana's analysis.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean verify

      - name: Upload JaCoCo HTML report as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.2

      - name: Upload Qodana report as an artifact
        uses: actions/upload-artifact@v4
        if: always() # This ensures the report is uploaded even if a previous step fails
        with:
          name: qodana-report
          path: qodana-report/

  build-and-push-docker-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-analyse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
